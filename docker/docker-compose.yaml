services:
  postgres:
    image: postgres:alpine
    container_name: BITSM-pgsql
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'bitsm_app'
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres: